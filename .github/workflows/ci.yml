# Runs the checks on a Mac, a Windows PC and a Linux PC every time code is pushed.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false # if one computer fails, still finish the others
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to an exact commit, so nobody can change what this step runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
