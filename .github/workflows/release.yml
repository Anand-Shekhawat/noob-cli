# Builds Noob for Mac, Windows and Linux whenever a version tag (like v0.3.0) is pushed,
# and attaches the downloads to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the Release and upload files to it

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make an empty Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "Noob ${{ github.ref_name }}" --generate-notes

  build:
    name: Build for ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }   # Macs with Apple chips
          - { os: macos-latest, target: x86_64-apple-darwin }    # Macs with Intel chips
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      NAME: noob-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Use stable Rust for this target
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package for Mac and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/noob" README.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:NAME | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/noob.exe", README.md $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"
          $hash = (Get-FileHash "$env:NAME.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:NAME.zip" | Out-File -Encoding ascii "$env:NAME.zip.sha256"

      - name: Upload to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$NAME".* --clobber

  try-windows-installer:
    name: Install on a fresh Windows PC, the way users will
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the one-line installer
        shell: pwsh
        run: ./scripts/install.ps1
      - name: Check Noob runs
        shell: pwsh
        run: |
          $noob = Join-Path $env:LOCALAPPDATA 'Programs\noob\noob.exe'
          $version = & $noob version
          Write-Host $version
          if ($version -notmatch '${{ github.ref_name }}'.TrimStart('v')) { throw "Wrong version: $version" }
