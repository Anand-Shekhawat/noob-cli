# Builds Noob for Mac, Windows and Linux whenever a version tag (like v0.3.0) is pushed,
# and attaches the downloads to a GitHub Release.
#
# Safety notes:
# - Each job gets only the permissions it needs.
# - actions/checkout is pinned to an exact commit, so nobody can change what it runs.
# - The tag name reaches commands through the TAG variable, never pasted into them.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the Release
    steps:
      - name: Check the tag looks like a version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
      - name: Make an empty Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Noob $TAG" --generate-notes

  build:
    name: Build for ${{ matrix.target }}
    needs: create-release
    permissions:
      contents: write # to upload the downloads
    strategy:
      fail-fast: false
      matrix:
        include:
          # "app" also builds Noob's window. Linux gets the terminal Noob only, for now.
          - { os: macos-latest, target: aarch64-apple-darwin, features: app }   # Apple chips
          - { os: macos-latest, target: x86_64-apple-darwin, features: app }    # Intel chips
          - { os: windows-latest, target: x86_64-pc-windows-msvc, features: app }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, features: "" }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use stable Rust for this target
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add "$TARGET"

      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET" --features "$FEATURES"

      - name: Package for Mac and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NAME="noob-$TAG-$TARGET"
          mkdir "$NAME"
          cp "target/$TARGET/release/noob" README.md LICENSE "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - name: Package the Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/make-mac-app.sh "$TARGET" "${TAG#v}"
          APP_ZIP="Noob-$TAG-$TARGET.zip"
          ditto -c -k --keepParent "target/$TARGET/release/Noob.app" "$APP_ZIP"
          shasum -a 256 "$APP_ZIP" > "$APP_ZIP.sha256"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "noob-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/$env:TARGET/release/noob.exe", "target/$env:TARGET/release/noob-app.exe", assets/noob.ico, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob # the Mac app's files only exist on Macs
          gh release upload "$TAG" noob-"$TAG"-"$TARGET".* Noob-"$TAG"-"$TARGET".* --repo "$GITHUB_REPOSITORY"

  try-windows-installer:
    name: Install on a fresh Windows PC, the way users will
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the installer for this exact version
        shell: pwsh
        run: ./scripts/install.ps1 -Version $env:TAG
      - name: Check Noob runs and is the right version
        shell: pwsh
        run: |
          $noob = Join-Path $env:LOCALAPPDATA 'Programs\noob\noob.exe'
          $shown = & $noob version
          Write-Host $shown
          $expected = "Noob " + $env:TAG.TrimStart('v')
          if ($shown -ne $expected) { throw "Expected '$expected' but got '$shown'" }
      - name: Check the app and its Start menu entry are there
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\noob\noob-app.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Noob.lnk'
          if (-not (Test-Path $app)) { throw "noob-app.exe wasn't installed" }
          if (-not (Test-Path $shortcut)) { throw "The Start menu entry wasn't made" }
          Write-Host "Found $app and $shortcut"
